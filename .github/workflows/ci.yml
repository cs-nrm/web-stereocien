# La puerta: `pnpm build`, el mismo que tendrá que pasar cualquier despliegue.
#
# Por qué existe (heredado de web-beat). Allá el despliegue corre `pnpm build`
# completo en la VM, y una puerta que falla aborta el despliegue A MEDIAS: el
# `git pull` ya se hizo, el `install` ya cambió `node_modules`, y el servicio
# sigue con el artefacto viejo mientras el repo dice otra cosa. Descubrirlo aquí
# cuesta dos minutos; descubrirlo en el servidor cuesta un despliegue torcido, y
# allá pasó tres veces en una tarde.
#
# `pnpm check` NO sería puerta suficiente: el compilador del build rechaza cosas
# que `astro check` acepta —un comentario mal cerrado dio 0 errores en `check` y
# reventó el build—. Por eso aquí corre `build`, que encadena check + guardas +
# build + guarda-cascada.
#
# Esta puerta NO despliega y no necesita un solo secreto, así que es segura de
# correr en un pull request de quien sea. Importa: el repo es PÚBLICO
# (`gh repo view cs-nrm/web-stereocien --json visibility`, comprobado el
# 2026-09-28).
name: CI

# Aquí no hay `deploy.yml` (el sitio nuevo todavía no tiene dónde desplegarse),
# así que esta puerta corre en los dos momentos: en cada push a `stereocien-v2` y
# en cada pull request hacia ella. La rama `stereocien` es el sitio viejo y no
# pasa por aquí.
on:
  push:
    branches: [stereocien-v2]
  pull_request:
    branches: [stereocien-v2]

# Si llegan dos pushes seguidos, el primero se cancela: lo que importa es si la
# punta de la rama compila, no si compilaba un commit que ya nadie va a desplegar.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  puerta:
    name: build (la puerta)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      # La versión sale de `.nvmrc`, que es la misma que acepta `engines` de
      # package.json (>=22.12). Que se lea del archivo y no esté escrita aquí es
      # justo lo que evita que las dos se separen sin que nadie lo note.
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      # pnpm entra por corepack leyendo `packageManager` de package.json
      # (pnpm@9.0.0). Ninguna acción de terceros para instalarlo: en un repo
      # público, cada acción externa es código ajeno con acceso al workflow.
      - name: Habilitar corepack
        run: corepack enable
        env:
          COREPACK_ENABLE_DOWNLOAD_PROMPT: 0

      - name: Caché del almacén de pnpm
        uses: actions/cache@v4
        with:
          path: ~/.local/share/pnpm/store
          key: pnpm-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: pnpm-${{ runner.os }}-

      # `--frozen-lockfile` a propósito: si el lock y el package.json no cuadran,
      # que falle aquí. Una puerta no es sitio para resolver un árbol de
      # dependencias.
      - name: Dependencias
        run: pnpm install --frozen-lockfile

      # SIN `.env`, y es deliberado: así esta puerta no necesita un solo secreto.
      #
      # Lo que NO cubre, por lo mismo: que el sitio tenga contenido. `CMS_URL` es
      # de ejecución y aquí no existe, así que un build verde puede seguir
      # sirviendo la casa vacía. Eso se comprueba contra el proceso ya arrancado,
      # no aquí.
      - name: Build
        run: pnpm build
